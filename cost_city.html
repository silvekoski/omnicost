<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Omnicost</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" /><style>
  .ph{vertical-align:-.125em}
  :root{
    --bg:#17181c; --panel:rgba(31,33,39,.80); --line:#2e3138;
    --ink:#f4f3f0; --dim:#8c8a84; --pink:#c87f59; --pink-bright:#d4905f;
    --mint:#7ba78f; --teal:#7ba78f; --amber:#d4a35a;
    --font:Helvetica,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);
    -webkit-font-smoothing:antialiased;overflow:hidden}
  .wrap{margin:0;padding:0;height:100vh;display:flex;flex-direction:column;position:relative}

  /* ---- Header above canvas ---- */
  .header{position:absolute;top:14px;left:14px;z-index:6;
    display:flex;align-items:flex-end;gap:18px;padding:12px 15px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .title h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.2px}
  .title p{margin:3px 0 0;font-size:12.5px;color:var(--dim)}
  .controls{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
  .scrubber{display:flex;flex-direction:column;gap:5px;min-width:330px}
  .scrub-row{display:grid;grid-template-columns:32px 1fr 86px;align-items:center;gap:9px}
  .scrub-row label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
  .scrub-row .d{font-size:12px;color:var(--ink);font-weight:600;
    font-variant-numeric:tabular-nums;text-align:right}
  .scrub-readout{font-size:11.5px;color:var(--dim);text-align:right;margin-top:1px}
  .scrub-readout b{color:var(--pink-bright);font-size:14px;font-weight:700;
    font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(200,127,89,.45)}
  .rng{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:999px;
    background:linear-gradient(90deg,var(--teal),var(--pink));outline:none;cursor:pointer}
  .rng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;
    border-radius:50%;background:#f4f3f0;border:2px solid var(--pink);cursor:pointer;
    box-shadow:0 0 10px rgba(200,127,89,.6)}
  .rng::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#f4f3f0;
    border:2px solid var(--pink);cursor:pointer;box-shadow:0 0 10px rgba(200,127,89,.6)}
  .presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .preset{font:600 11px/1 var(--font);color:var(--dim);background:transparent;
    border:1px solid var(--line);border-radius:999px;padding:5px 9px;cursor:pointer;
    transition:all .13s ease;user-select:none}
  .preset:hover{color:var(--ink);border-color:rgba(255,255,255,.25)}
  .preset.active{background:var(--pink);border-color:var(--pink);color:#f4f3f0;
    box-shadow:0 0 12px rgba(200,127,89,.4)}
  .dates{display:none}
  .dates b{display:block;color:var(--ink);font-size:13px;font-weight:600;letter-spacing:.3px}

  /* ---- Stage ---- */
  .stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
    background:radial-gradient(120% 120% at 50% 12%,#1f2127 0%,#1c1d22 55%,#17181c 100%)}
  canvas{display:block;width:100%;height:100%}
  .annotation-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

  .panel{position:absolute;background:var(--panel);border:1px solid var(--line);
    border-radius:11px;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:6}

  /* legend */
  .legend{left:14px;top:14px;padding:11px 13px;width:178px}
  .legend .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;
    margin-bottom:8px;font-weight:600}
  .legend .bar{height:9px;border-radius:5px;
    background:linear-gradient(90deg,#7ba78f,#a7a06f,#c89a6a,#c87f59)}
  .legend .ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);
    margin-top:5px}

  /* summary */
  .summary{right:14px;top:14px;padding:13px 16px;width:236px}
  .summary .row{display:flex;justify-content:space-between;align-items:baseline;
    padding:5px 0}
  .summary .row .k{font-size:11.5px;color:var(--dim)}
  .summary .row .v{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
  .summary .sug .v{color:var(--mint)}
  .summary .save{border-top:1px solid var(--line);margin-top:5px;padding-top:9px}
  .summary .save .v{color:var(--pink-bright);text-shadow:0 0 14px rgba(200,127,89,.55)}
  .summary .pct{font-size:12.5px;color:var(--pink-bright);font-weight:600}
  .summary .sub{font-size:10.5px;color:var(--dim);line-height:1.35;margin-top:8px}

  /* top moves */
  .topmoves{right:14px;bottom:14px;padding:12px 14px;width:262px}
  .topmoves h3{margin:0 0 8px;font-size:11px;color:var(--dim);text-transform:uppercase;
    letter-spacing:.8px;font-weight:600}
  .topmoves .mv{display:flex;justify-content:space-between;gap:10px;font-size:12px;
    padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
  .topmoves .mv:last-child{border-bottom:0}
  .topmoves .mv .route{color:var(--ink)}
  .topmoves .mv .route b{color:var(--pink-bright);font-weight:600}
  .topmoves .mv .geo{color:var(--dim)}
  .topmoves .mv .sp{color:var(--teal);font-weight:600;font-variant-numeric:tabular-nums}

  /* tooltip */
  .tooltip{position:absolute;pointer-events:none;z-index:8;display:none;max-width:300px;
    background:rgba(31,33,39,.96);border:1px solid var(--line);border-radius:9px;
    padding:9px 11px;font-size:11.5px;line-height:1.5;box-shadow:0 8px 26px rgba(0,0,0,.5)}
  .tooltip .t-head{font-weight:650;margin-bottom:4px;font-size:12px}
  .tooltip .t-row{display:flex;justify-content:space-between;gap:14px;color:var(--dim)}
  .tooltip .t-row span{color:var(--ink)}
  .tooltip .t-target{margin-top:5px;color:var(--pink-bright);font-weight:600}
  .tooltip .t-warn{margin-top:6px;padding-top:6px;border-top:1px solid rgba(212,163,90,.25);
    color:var(--amber);font-size:10.8px;line-height:1.4}
  /* customers running on the hovered building */
  .tooltip .t-cust{margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
  .tooltip .t-cust-h{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);
    margin-bottom:5px;display:flex;align-items:center;gap:5px}
  .tooltip .t-cust-row{display:flex;justify-content:space-between;gap:12px;margin:3px 0}
  .tooltip .t-cust-row .cc{color:var(--ink);font-weight:600;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .tooltip .t-cust-row .cm{color:var(--teal);font-variant-numeric:tabular-nums;white-space:nowrap}
  .tooltip .t-cust-more{font-size:10px;color:var(--dim);margin-top:4px}

  /* annotation callouts */
  .annotations{position:absolute;inset:0;pointer-events:none;z-index:7}
  .anno{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
    font-size:11px;font-weight:600;padding:5px 9px;border-radius:8px;
    background:rgba(15,16,20,.86);border:1px solid var(--line);
    box-shadow:0 4px 16px rgba(0,0,0,.4);display:none}
  .anno.warning{border-color:rgba(212,163,90,.6);color:var(--amber)}
  .anno.move{border-color:rgba(200,127,89,.55);color:var(--pink-bright)}
  .anno.neutral{border-color:rgba(132,184,156,.5);color:var(--mint)}
  .dlabel{position:absolute;transform:translate(-50%,-50%);pointer-events:none;display:none;
    font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    color:rgba(255,255,255,.38);text-shadow:0 1px 6px rgba(0,0,0,.7)}

  .hint{margin-top:9px;flex:0 0 auto;font-size:11.5px;color:var(--dim);display:flex;gap:18px;flex-wrap:wrap}
  .hint b{color:#b6b4ad;font-weight:600}
  .toggles{display:flex;gap:14px;margin-left:auto}
  .toggles label{cursor:pointer;display:flex;align-items:center;gap:5px}
  .toggles input{accent-color:var(--pink)}

  /* ---- Customers panel (bottom-left) ---- */
  .customers{left:14px;bottom:14px;padding:11px 12px;width:248px;display:none}
  .customers h3{margin:0 0 4px;font-size:11px;color:var(--dim);text-transform:uppercase;
    letter-spacing:.8px;font-weight:600}
  .customers .csub{font-size:10.5px;color:var(--dim);margin-bottom:8px}
  .customers .clist{max-height:32vh;overflow-y:auto;margin:0 -4px;padding:0 4px}
  .crow{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:6px 7px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .crow:hover{background:rgba(255,255,255,.05);border-color:var(--line)}
  .crow .cname{font-size:12px;color:var(--ink);font-weight:600;line-height:1.2}
  .crow .croute{font-size:10.5px;color:var(--dim);margin-top:1px}
  .crow .croute b{color:var(--teal);font-weight:600}
  .cbadge{font-size:11px;font-weight:700;color:var(--pink-bright);
    font-variant-numeric:tabular-nums;white-space:nowrap;
    text-shadow:0 0 10px rgba(200,127,89,.4)}
  .cbadge.flat{color:var(--dim);text-shadow:none}
  .stat .v.ok{color:var(--mint);font-size:13.5px}

  /* ---- Customer / email modal ---- */
  .modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;
    justify-content:center;padding:24px;background:rgba(10,10,13,.66);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .modal.open{display:flex}
  .card{background:#1f2127;border:1px solid var(--line);border-radius:16px;
    width:min(680px,100%);max-height:90vh;overflow-y:auto;
    box-shadow:0 24px 70px rgba(0,0,0,.6);padding:22px 24px}
  .card .x{float:right;cursor:pointer;color:var(--dim);font-size:20px;line-height:1;
    border:0;background:none;padding:2px 6px}
  .card .x:hover{color:var(--ink)}
  .card h2{margin:0;font-size:18px;font-weight:650}
  .card .meta{font-size:12px;color:var(--dim);margin:3px 0 14px}
  .statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .stat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;
    padding:8px 10px}
  .stat .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .stat .v{font-size:15px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
  .stat .v.move b{color:var(--pink-bright)}
  .stat .v.disc{color:var(--pink-bright)}
  .reslist{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
  .reshead,.resrow{display:grid;grid-template-columns:2fr 1.2fr .7fr .8fr;gap:8px;
    padding:6px 11px;font-size:11.5px}
  .reshead{color:var(--dim);text-transform:uppercase;letter-spacing:.4px;font-size:10px;
    background:rgba(255,255,255,.03);border-bottom:1px solid var(--line)}
  .resrow{border-bottom:1px dashed rgba(255,255,255,.06)}
  .resrow:last-child{border-bottom:0}
  .resrow .rsp{text-align:right;color:var(--teal);font-variant-numeric:tabular-nums}
  .resrow .rsv{text-align:right;color:var(--pink-bright);font-variant-numeric:tabular-nums}
  .btn{font:inherit;font-size:13px;font-weight:600;border-radius:10px;cursor:pointer;
    padding:10px 16px;border:1px solid var(--line);background:rgba(255,255,255,.05);
    color:var(--ink);transition:filter .15s}
  .btn:hover{filter:brightness(1.18)}
  .btn:disabled{opacity:.5;cursor:default;filter:none}
  .btn.primary{background:#84b89c;color:#14151a;border:0}
  .btn.send{background:var(--pink);color:#201912;border:0}
  .emailbox{margin-top:6px;display:none}
  .emailbox.show{display:block}
  .emailbox label{display:block;font-size:10px;color:var(--dim);text-transform:uppercase;
    letter-spacing:.5px;margin:10px 0 4px}
  .emailbox input,.emailbox textarea{width:100%;background:#131419;color:var(--ink);
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;
    font-size:13px;line-height:1.55;resize:vertical}
  .emailbox textarea{min-height:200px}
  .modelnote{font-size:10.5px;color:var(--dim);margin-top:5px}
  .actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .status{font-size:12px;margin-left:2px}
  .status.ok{color:var(--mint)} .status.warn{color:var(--amber)} .status.err{color:#d98b6b}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.25);
    border-top-color:#f4f3f0;border-radius:50%;animation:spin .7s linear infinite;
    vertical-align:-2px;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="controls">
      <div class="scrubber">
        <div class="scrub-row"><label>From</label>
          <input class="rng" type="range" id="from" min="0" max="0" step="1" value="0"
                 aria-label="Window start date" />
          <span class="d" id="from-date">—</span></div>
        <div class="scrub-row"><label>To</label>
          <input class="rng" type="range" id="to" min="0" max="0" step="1" value="0"
                 aria-label="Window end date" />
          <span class="d" id="to-date">—</span></div>
        <div class="scrub-readout"><b id="scrub-days">—</b> day window</div>
        <div class="presets" id="presets"></div>
      </div>
      <div class="dates"><span>Window</span><b id="dates">—</b></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <svg class="annotation-lines" id="lines"></svg>
    <div class="annotations" id="annotations"></div>

    <div class="panel summary">
      <div class="row"><span class="k">Current spend</span><span class="v" id="s-current">—</span></div>
      <div class="row sug"><span class="k">Suggested spend</span><span class="v" id="s-suggested">—</span></div>
      <div class="row save"><span class="k">You save</span>
        <span><span class="v" id="s-save">—</span> <span class="pct" id="s-pct"></span></span></div>
      <div class="sub" id="s-sub"></div>
    </div>

    <div class="panel topmoves">
      <h3>Top credible moves</h3>
      <div id="moves"></div>
    </div>


    <div class="tooltip" id="tooltip"></div>
  </div>

  <div class="hint">
    <span><b>Drag</b> orbit</span>
    <span><b>Scroll</b> zoom</span>
    <span><b>Hover</b> a building for detail + customers</span>
    <div class="toggles">
      <label><input type="checkbox" id="t-anno" checked> annotations</label>
      <label><input type="checkbox" id="t-conn" checked> connectors</label>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ============================== DATA ==============================
  const DATA = JSON.parse(
    document.getElementById('cost-data').textContent.replace(/\/\*[\s\S]*?\*\//g,'').trim() || '{}'
  );
  // Time-bucketed data: every cell carries per-bucket spend + savings, so the browser
  // sums any [from,to] bucket range live — change the window length AND slide it back
  // through history. Buckets are bucket_days wide (default weekly).
  const TOP_N = 250;                                   // max buildings rendered
  const PRESETS = [30, 60, 90, 120, 150, 180];         // quick window-length buttons (days)
  const NB = (DATA.cells && DATA.bucket_starts) ? DATA.n_buckets : 0;
  const BUCKET_DAYS = DATA.bucket_days || 7;
  const hasData = NB > 0 && DATA.cells.length > 0;
  let bTo = NB - 1;                                    // default window: most recent ~90 days
  let bFrom = Math.max(0, NB - Math.round(90 / BUCKET_DAYS));
  const nm = (kind, idx) => (DATA[kind] && DATA[kind][idx]) || '?';

  // Row layout: [cloudIdx, geoIdx, svcIdx, skuIdx, spend, savingsRatio, targetCloudIdx]
  const R = {cloud:0, geo:1, svc:2, sku:3, spend:4, sr:5, target:6};

  // ====================== ANNOTATION CONFIG =========================
  // Which stable patterns get a persistent callout. Edit freely — matchers run
  // against the active window's rows and resolve to a single anchor building.
  function pickMax(rows, score){
    let best=null, bv=-Infinity;
    for(const r of rows){ const v=score(r); if(v>bv){bv=v; best=r;} }
    return best;
  }
  const ANNOTATIONS = [
    { id:'mismatch', style:'warning', dx:0, dy:-58,
      text:'Catalog mismatch — 121× is not a real price gap',
      match: rows => pickMax(rows.filter(r =>
        nm('clouds',r[R.cloud])==='cloud_d' && nm('skus',r[R.sku])==='compute-cpu-optimized'),
        r => r[R.sr]) },
    { id:'move', style:'move', dx:0, dy:-58,
      text:'Biggest credible move → cloud_b',
      match: rows => pickMax(rows.filter(r =>
        r[R.target]>=0 && nm('clouds',r[R.target])==='cloud_b' && r[R.sr]<0.85 &&
        (nm('skus',r[R.sku]).startsWith('network') || nm('skus',r[R.sku]).startsWith('compute'))),
        r => r[R.spend]*r[R.sr]) },
    { id:'cheapest', style:'neutral', dx:0, dy:-52,
      text:'Most spend already on the cheapest cloud',
      match: rows => pickMax(rows.filter(r => r[R.sr]<0.05), r => r[R.spend]) },
  ];
  let showAnnotations = true, showConnectors = true;

  // ============================== SCENE =============================
  const PLANE = 100;
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('cv');
  const tooltip = document.getElementById('tooltip');
  const annoLayer = document.getElementById('annotations');
  const linesSvg = document.getElementById('lines');

  let renderer = null, glOk = false;
  try {
    renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    glOk = true;
  } catch(e){
    console.warn('WebGL unavailable — showing data panels only.', e);
  }
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x17181c);
  scene.fog = new THREE.Fog(0x17181c, 180, 420);

  const camera = new THREE.PerspectiveCamera(48, 1, 0.5, 2000);
  scene.add(new THREE.AmbientLight(0x6f6c6a, 0.95));
  const dir = new THREE.DirectionalLight(0xffffff, 0.85);
  dir.position.set(60, 120, 40); scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0xcdb79a, 0.18);
  dir2.position.set(-80, 40, -60); scene.add(dir2);

  const grid = new THREE.GridHelper(PLANE*1.6, 24, 0x2e3138, 0x1f2127);
  grid.position.y = -0.5; scene.add(grid);

  const cityGroup = new THREE.Group();
  scene.add(cityGroup);

  // mutable render state
  let buildingMeshes = [], floorMeshes = [];
  let districtCenters = {};   // cloudIdx -> {x,z}
  let hScale = null;
  let beam = null, hovered = null;
  let screenLabels = [];      // {el, line, world:Vector3, dx, dy}
  let currentW = null;        // the active computed window object

  // ============================== SCALES ============================
  function srColor(sr){
    const t = Math.min(sr, 0.60) / 0.60;            // 0..1, clamped at 60%
    const c = new THREE.Color();
    c.setHSL(0.409 - t*0.364, 0.22 + t*0.30, 0.55 - t*0.03); // sage -> clay
    return c;
  }
  const DISTRICT_HUE = {};   // assigned per cloud at build
  function districtColor(cloudIdx){
    const h = DISTRICT_HUE[cloudIdx] != null ? DISTRICT_HUE[cloudIdx] : 0.6;
    return new THREE.Color().setHSL(h, 0.18, 0.12);
  }

  // ============================== LAYOUT ============================
  // Two-level treemap: split the plane into per-cloud districts by spend,
  // then treemap each district's cells. Data-driven (only priced clouds appear).
  function layoutCity(rows){
    const byCloud = d3.groups(rows, r => r[R.cloud]);
    // assign a distinct dark hue per district for neighborhood read
    byCloud.forEach(([c], i) => { DISTRICT_HUE[c] = (0.55 + i*0.13) % 1; });

    const root = d3.hierarchy({children: byCloud.map(([c, rs]) => ({
        cloudIdx:c, rows:rs, total:d3.sum(rs, r=>r[R.spend])}))})
      .sum(d => d.total || 0).sort((a,b)=>b.value-a.value);
    d3.treemap().size([PLANE, PLANE]).paddingOuter(2).paddingInner(3.5).round(false)(root);

    const buildings = [], floors = [], centers = {};
    for(const dn of root.leaves()){
      const {x0,y0,x1,y1} = dn, c = dn.data.cloudIdx;
      floors.push({cloudIdx:c, x0,y0,x1,y1});
      centers[c] = {x:(x0+x1)/2 - PLANE/2, z:(y0+y1)/2 - PLANE/2};
      const cellRoot = d3.hierarchy({children: dn.data.rows.map(r => ({row:r}))})
        .sum(d => d.row ? d.row[R.spend] : 0).sort((a,b)=>b.value-a.value);
      d3.treemap().size([x1-x0, y1-y0]).paddingInner(0.55).round(false)(cellRoot);
      for(const cn of cellRoot.leaves()){
        buildings.push({
          row: cn.data.row,
          cx: x0 + (cn.x0+cn.x1)/2 - PLANE/2,
          cz: y0 + (cn.y0+cn.y1)/2 - PLANE/2,
          w:  Math.max(0.55, (cn.x1-cn.x0) - 0.45),
          d:  Math.max(0.55, (cn.y1-cn.y0) - 0.45),
        });
      }
    }
    return {buildings, floors, centers};
  }

  // ============================== BUILD =============================
  function buildCity(W){
    const rows = W.rows;
    const layout = layoutCity(rows);
    districtCenters = layout.centers;

    const maxSpend = d3.max(rows, r=>r[R.spend]) || 1;
    hScale = d3.scaleSqrt().domain([0, maxSpend]).range([0.6, 44]);

    for(const f of layout.floors){
      const w = f.x1-f.x0, d = f.y1-f.y0;
      const col = districtColor(f.cloudIdx);
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(w, 0.6, d),
        new THREE.MeshLambertMaterial({color:col, emissive:col.clone().multiplyScalar(0.5)}));
      m.position.set(f.x0 + w/2 - PLANE/2, -0.3, f.y0 + d/2 - PLANE/2);
      cityGroup.add(m); floorMeshes.push(m);
    }
    for(const b of layout.buildings){
      const sr = b.row[R.sr], h = hScale(b.row[R.spend]);
      const col = srColor(sr);
      const emi = col.clone().multiplyScalar(0.18);
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(b.w, h, b.d),
        new THREE.MeshLambertMaterial({color:col, emissive:emi}));
      m.position.set(b.cx, h/2, b.cz);
      m.userData = {cell:b.row, baseEmissive:emi.clone(), top:h, cx:b.cx, cz:b.cz};
      cityGroup.add(m); buildingMeshes.push(m);
    }
    buildDistrictLabels(layout.floors);
    resolveAnnotations(rows);
  }

  function clearCity(){
    clearHover();
    for(const m of buildingMeshes){ m.geometry.dispose(); m.material.dispose(); }
    for(const m of floorMeshes){ m.geometry.dispose(); m.material.dispose(); }
    cityGroup.clear();
    buildingMeshes = []; floorMeshes = [];
    annoLayer.innerHTML = ''; linesSvg.innerHTML = '';
    screenLabels = [];
  }

  // ===================== ANNOTATIONS / LABELS =======================
  function buildDistrictLabels(floors){
    for(const f of floors){
      const el = document.createElement('div');
      el.className = 'dlabel';
      el.textContent = nm('clouds', f.cloudIdx);
      annoLayer.appendChild(el);
      screenLabels.push({
        el, line:null, dx:0, dy:0,
        world:new THREE.Vector3((f.x0+f.x1)/2 - PLANE/2, 0.5, (f.y0+f.y1)/2 - PLANE/2),
      });
    }
  }

  function resolveAnnotations(rows){
    for(const a of ANNOTATIONS){
      const row = a.match(rows);
      if(!row) continue;
      const mesh = buildingMeshes.find(m => m.userData.cell === row);
      if(!mesh) continue;
      const el = document.createElement('div');
      el.className = 'anno ' + a.style;
      el.textContent = a.text;
      annoLayer.appendChild(el);
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      const col = a.style==='warning' ? '#d4a35a' : a.style==='move' ? '#d4905f' : '#84b89c';
      line.setAttribute('stroke', col);
      line.setAttribute('stroke-width','1.4');
      line.setAttribute('stroke-dasharray','3 3');
      line.setAttribute('opacity','0.75');
      linesSvg.appendChild(line);
      screenLabels.push({
        el, line, dx:a.dx, dy:a.dy, anno:true,
        world:new THREE.Vector3(mesh.userData.cx, mesh.userData.top + 7, mesh.userData.cz),
      });
    }
  }

  const _v = new THREE.Vector3();
  function projectLabels(){
    const w = stage.clientWidth, h = stage.clientHeight;
    for(const L of screenLabels){
      const isAnno = !!L.anno;
      const visible = isAnno ? showAnnotations : true;
      _v.copy(L.world).project(camera);
      const onScreen = _v.z < 1 && _v.x>-1.05 && _v.x<1.05 && _v.y>-1.05 && _v.y<1.05;
      if(!visible || !onScreen){
        L.el.style.display='none'; if(L.line) L.line.style.display='none'; continue;
      }
      const x = (_v.x*0.5+0.5)*w, y = (-_v.y*0.5+0.5)*h;
      const lx = x + (L.dx||0), ly = y + (L.dy||0);
      L.el.style.display='block';
      L.el.style.left = lx+'px'; L.el.style.top = ly+'px';
      if(L.line){
        if(showConnectors){
          L.line.style.display='block';
          L.line.setAttribute('x1', lx); L.line.setAttribute('y1', ly + 10);
          L.line.setAttribute('x2', x);  L.line.setAttribute('y2', y);
        } else L.line.style.display='none';
      }
    }
  }

  // ============================== PANELS ============================
  function fmtUnits(v){
    if(v>=1e6) return (v/1e6).toFixed(2)+'M u';
    if(v>=1e3) return (v/1e3).toFixed(0)+'K u';
    return Math.round(v)+' u';
  }
  function renderPanels(W){
    document.getElementById('dates').textContent = W.start + '  →  ' + W.end;
    document.getElementById('s-current').textContent = fmtUnits(W.current);
    document.getElementById('s-suggested').textContent = fmtUnits(W.suggested);
    document.getElementById('s-save').textContent = fmtUnits(W.current - W.suggested);
    document.getElementById('s-pct').textContent = '('+(W.capped_pct*100).toFixed(1)+'%)';
    document.getElementById('s-sub').textContent =
      'Raw addressable '+(W.raw_pct*100).toFixed(1)+'% — includes catalog-mismatch outliers.';

    const moves = W.rows
      .filter(r => r[R.target]>=0 && r[R.sr]<0.85)
      .map(r => ({r, av:r[R.spend]*r[R.sr]}))
      .sort((a,b)=>b.av-a.av).slice(0,4);
    document.getElementById('moves').innerHTML = moves.map(({r}) =>
      `<div class="mv"><span class="route">${nm('clouds',r[R.cloud])} <b>→ ${nm('clouds',r[R.target])}</b>
        <span class="geo">· ${nm('geos',r[R.geo])}</span></span>
        <span class="sp">${Math.round(r[R.sr]*100)}%</span></div>`).join('');
  }

  // ========================== DATE SLIDERS ==========================
  // Two sliders over the time buckets define the window [from, to]. Drag "To" left to
  // travel back in history; drag "From" to change the length. Panels update on every
  // step; the 3D rebuild is throttled so dragging stays smooth.
  const elFrom = document.getElementById('from');
  const elTo = document.getElementById('to');

  // Sum every cell's per-bucket spend/savings over [f, t] -> a window object that the
  // rest of the app consumes exactly like the old precomputed windows.
  function computeWindow(f, t){
    f = Math.max(0, Math.min(NB - 1, f | 0));
    t = Math.max(0, Math.min(NB - 1, t | 0));
    if(f > t){ const x = f; f = t; t = x; }
    let current = 0, suggested = 0, rawpot = 0;
    const cells = [];
    for(const c of DATA.cells){
      const bs = c[5], ss = c[6], ps = c[7];
      let spend = 0, pot = 0;
      for(let i = 0; i < bs.length; i++){
        const b = bs[i];
        if(b < f) continue;
        if(b > t) break;                 // bucket indices are ascending
        spend += ss[i]; pot += ps[i];
      }
      if(spend <= 0) continue;
      const sr = Math.max(0, Math.min(1, pot / spend));
      current += spend; rawpot += spend * sr; suggested += spend * (1 - Math.min(sr, 0.60));
      cells.push([c[0], c[1], c[2], c[3], spend, sr, c[4]]);
    }
    cells.sort((a, b) => b[4] - a[4]);
    const rows = cells.slice(0, TOP_N).map(c =>
      [c[0], c[1], c[2], c[3], Math.round(c[4]), +c[5].toFixed(4), c[6]]);
    return {
      rows, current, suggested,
      raw_pct: current ? rawpot / current : 0,
      capped_pct: current ? (current - suggested) / current : 0,
      days: (t - f + 1) * BUCKET_DAYS,
      start: DATA.bucket_starts[f], end: DATA.bucket_ends[t],
      bFrom: f, bTo: t,
    };
  }

  function buildSliders(){
    if(!hasData) return;
    elFrom.max = NB - 1; elTo.max = NB - 1;
    elFrom.value = bFrom; elTo.value = bTo;
    elFrom.addEventListener('input', () => onSlide('from'));
    elTo.addEventListener('input', () => onSlide('to'));
    elFrom.addEventListener('change', flushBuild);
    elTo.addEventListener('change', flushBuild);
  }
  function syncControls(W){
    elFrom.value = W.bFrom; elTo.value = W.bTo;
    document.getElementById('from-date').textContent = W.start;
    document.getElementById('to-date').textContent = W.end;
    document.getElementById('scrub-days').textContent = W.days;
    markActivePreset(W);
  }

  // Preset length buttons (30..180d) — set the window length, keeping the current
  // end date so they work whether you're at "today" or back in history.
  function buildPresets(){
    const host = document.getElementById('presets');
    if(!host) return;
    host.innerHTML = '';
    for(const d of PRESETS){
      const b = document.createElement('button');
      b.className = 'preset'; b.textContent = d + 'd'; b.dataset.days = d;
      b.onclick = () => applyPreset(d);
      host.appendChild(b);
    }
  }
  function applyPreset(days){
    const nb = Math.max(1, Math.round(days / BUCKET_DAYS));   // length in buckets
    const t = bTo;                                            // keep current end (history pos)
    const f = Math.max(0, t - nb + 1);
    bFrom = f; bTo = t;
    currentW = computeWindow(f, t);
    syncControls(currentW);
    renderPanels(currentW);
    if(glOk) rebuildCity(currentW);
  }
  function markActivePreset(W){
    const days = W ? W.days : 0;
    document.querySelectorAll('.preset').forEach(b =>
      b.classList.toggle('active', Math.abs(days - (+b.dataset.days)) <= BUCKET_DAYS / 2));
  }

  let lastBuild = 0, slideTimer = null;
  function onSlide(which){
    let f = +elFrom.value, t = +elTo.value;
    if(f > t){                            // keep handles ordered: push the other one
      if(which === 'from'){ t = f; elTo.value = t; } else { f = t; elFrom.value = f; }
    }
    bFrom = f; bTo = t;
    currentW = computeWindow(f, t);
    syncControls(currentW);
    renderPanels(currentW);               // instant numbers + dates + moves
    if(!glOk) return;
    const now = performance.now();
    if(now - lastBuild > 70){ lastBuild = now; rebuildCity(currentW); }
    else { clearTimeout(slideTimer);
           slideTimer = setTimeout(() => { lastBuild = performance.now(); rebuildCity(currentW); }, 80); }
  }
  function flushBuild(){ if(glOk && currentW) rebuildCity(currentW); }
  function rebuildCity(W){
    if(!glOk || !W) return;
    clearCity();
    buildCity(W);
  }

  // ============================== CAMERA ============================
  const cam = {az:0.72, alt:0.62, dist:155, target:new THREE.Vector3(0,5,0)};
  let autoRotate = true;
  function updateCamera(){
    cam.alt = THREE.MathUtils.clamp(cam.alt, 0.12, 1.45);
    cam.dist = THREE.MathUtils.clamp(cam.dist, 70, 320);
    camera.position.set(
      cam.target.x + cam.dist*Math.cos(cam.alt)*Math.sin(cam.az),
      cam.target.y + cam.dist*Math.sin(cam.alt),
      cam.target.z + cam.dist*Math.cos(cam.alt)*Math.cos(cam.az));
    camera.lookAt(cam.target);
  }

  // ============================ PICKING =============================
  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  function clearHover(){
    if(hovered){
      hovered.material.emissive.copy(hovered.userData.baseEmissive);
      hovered = null;
    }
    if(beam){ beam.geometry.dispose(); beam.material.dispose(); scene.remove(beam); beam=null; }
  }
  function makeBeam(from, to){
    const mid = from.clone().lerp(to, 0.5);
    mid.y += from.distanceTo(to)*0.42 + 8;
    const curve = new THREE.QuadraticBezierCurve3(from, mid, to);
    const m = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 46, 0.55, 8, false),
      new THREE.MeshBasicMaterial({color:0xd4905f, transparent:true, opacity:0.75,
        blending:THREE.AdditiveBlending, depthWrite:false}));
    return m;
  }
  function setHover(mesh, clientX, clientY){
    hovered = mesh;
    mesh.material.emissive.copy(mesh.userData.baseEmissive).multiplyScalar(2.4);
    const r = mesh.userData.cell;
    const sr = r[R.sr];
    const tgt = r[R.target];
    let html = `<div class="t-head">${nm('clouds',r[R.cloud])} · ${nm('geos',r[R.geo])}</div>`;
    html += `<div class="t-row">service <span>${nm('services',r[R.svc])}</span></div>`;
    html += `<div class="t-row">sku <span>${nm('skus',r[R.sku])}</span></div>`;
    html += `<div class="t-row">spend <span>${fmtUnits(r[R.spend])}</span></div>`;
    html += `<div class="t-row">avoidable <span>${Math.round(sr*100)}%</span></div>`;
    html += tgt>=0
      ? `<div class="t-target">→ move to ${nm('clouds',tgt)}</div>`
      : `<div class="t-row">target <span>already cheapest</span></div>`;
    if(sr>0.80){
      html += `<div class="t-warn"><i class="ph ph-warning"></i> Spread this large likely means a SKU-bucket catalog
        mismatch (incompatible units across clouds), not a real price gap. Excluded from the
        credible number.</div>`;
    }
    // customers running on this building (provided by the Customers add-on; empty in static mode)
    if(window.__costcityCellCustomers){
      html += window.__costcityCellCustomers({
        cloud:   nm('clouds',   r[R.cloud]),
        geo:     nm('geos',     r[R.geo]),
        service: nm('services', r[R.svc]),
        sku:     nm('skus',     r[R.sku]),
        target:  tgt >= 0 ? nm('clouds', tgt) : null,
      });
    }
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    positionTooltip(clientX, clientY);

    if(tgt>=0 && districtCenters[tgt]){
      const from = new THREE.Vector3(mesh.userData.cx, mesh.userData.top+0.5, mesh.userData.cz);
      const c = districtCenters[tgt];
      const to = new THREE.Vector3(c.x, 4, c.z);
      beam = makeBeam(from, to);
      scene.add(beam);
    }
  }
  function positionTooltip(clientX, clientY){
    const r = stage.getBoundingClientRect();
    let x = clientX - r.left + 14, y = clientY - r.top + 14;
    if(x > r.width-260) x = clientX - r.left - 260;
    if(y > r.height-120) y = r.height-130;
    tooltip.style.left = x+'px'; tooltip.style.top = y+'px';
  }

  // ============================ EVENTS ==============================
  let dragging=false, lastX=0, lastY=0, downX=0, downY=0;
  canvas.addEventListener('pointerdown', e => {
    dragging=true; autoRotate=false; lastX=e.clientX; lastY=e.clientY;
    downX=e.clientX; downY=e.clientY;
    canvas.setPointerCapture(e.pointerId);
    clearHover(); tooltip.style.display='none';
  });
  window.addEventListener('pointermove', e => {
    if(dragging){
      cam.az -= (e.clientX-lastX)*0.005;
      cam.alt += (e.clientY-lastY)*0.005;
      lastX=e.clientX; lastY=e.clientY;
      return;
    }
    // hover pick (only over canvas)
    const r = canvas.getBoundingClientRect();
    if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){
      if(hovered){ clearHover(); tooltip.style.display='none'; }
      return;
    }
    ptr.x = ((e.clientX-r.left)/r.width)*2-1;
    ptr.y = -((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(buildingMeshes, false)[0];
    if(hit){
      if(hovered !== hit.object){ clearHover(); setHover(hit.object, e.clientX, e.clientY); }
      else positionTooltip(e.clientX, e.clientY);
    } else if(hovered){ clearHover(); tooltip.style.display='none'; }
  });
  window.addEventListener('pointerup', () => { dragging=false; });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    cam.dist *= (1 + e.deltaY*0.0012);
  }, {passive:false});

  // Click a building (not a drag) -> broadcast its cell so the Customers add-on
  // can show who runs there. Kept decoupled via a DOM event.
  canvas.addEventListener('click', e => {
    if(Math.hypot(e.clientX-downX, e.clientY-downY) > 6) return;   // it was an orbit drag
    const r = canvas.getBoundingClientRect();
    ptr.x = ((e.clientX-r.left)/r.width)*2-1;
    ptr.y = -((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(buildingMeshes, false)[0];
    if(!hit) return;
    const c = hit.object.userData.cell;
    window.dispatchEvent(new CustomEvent('costcity:cellclick', {detail:{
      cloud:   nm('clouds',   c[R.cloud]),
      geo:     nm('geos',     c[R.geo]),
      service: nm('services', c[R.svc]),
      sku:     nm('skus',     c[R.sku]),
      target:  c[R.target] >= 0 ? nm('clouds', c[R.target]) : null,
    }}));
  });

  document.getElementById('t-anno').onchange = e => { showAnnotations = e.target.checked; };
  document.getElementById('t-conn').onchange = e => { showConnectors = e.target.checked; };

  function resize(){
    if(!renderer) return;
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  // ============================== LOOP ==============================
  function animate(t){
    requestAnimationFrame(animate);
    const now = (t||0)*0.001;
    if(autoRotate) cam.az += 0.0024;
    updateCamera();
    if(beam) beam.material.opacity = 0.5 + 0.3*Math.sin(now*4);
    projectLabels();
    renderer.render(scene, camera);
  }

  // ============================== INIT ==============================
  function init(){
    buildSliders();
    buildPresets();
    if(!hasData){
      document.getElementById('s-sub').textContent =
        'No data inlined yet — run: uv run --python 3.12 build_multi.py';
      return;
    }
    currentW = computeWindow(bFrom, bTo);
    syncControls(currentW);
    renderPanels(currentW);            // numbers first, so they survive a WebGL failure
    if(!glOk){
      const note = document.createElement('div');
      note.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;'+
        'justify-content:center;color:#8c8a84;font-size:13px;text-align:center;padding:0 40px';
      note.textContent = '3D view unavailable (WebGL disabled) — numbers and moves are shown above.';
      stage.appendChild(note);
      return;
    }
    resize();
    buildCity(currentW);
    animate();
  }
  init();
})();
</script>

<!-- ===================== Customers & AI outreach ===================== -->
<!-- Self-contained add-on. Talks to the optional backend (server.py); if the
     /api endpoints aren't reachable (e.g. opened as a static file) it silently
     hides the Customers panel so the 3D dashboard works exactly as before. -->
<div class="modal" id="cust-modal">
  <div class="card" id="cust-card">
    <button class="x" id="cust-close" aria-label="Close"><i class="ph ph-x"></i></button>
    <h2 id="cm-company">—</h2>
    <div class="meta" id="cm-meta">—</div>
    <div class="statgrid" id="cm-stats"></div>
    <div class="reslist" id="cm-res"></div>
    <button class="btn primary" id="cm-draft"><i class="ph ph-sparkle"></i> Draft email with AI</button>
    <div class="emailbox" id="cm-email">
      <label for="cm-subject">Subject</label>
      <input id="cm-subject" type="text" />
      <label for="cm-body">Body</label>
      <textarea id="cm-body"></textarea>
      <div class="modelnote" id="cm-model"></div>
      <div class="actions">
        <button class="btn send" id="cm-send">Send</button>
        <span class="status" id="cm-status"></span>
      </div>
    </div>
  </div>
</div>

<!-- Popup: customers running on a clicked building -->
<div class="modal" id="cell-modal">
  <div class="card" id="cell-card" style="width:min(440px,100%)">
    <button class="x" id="cell-close" aria-label="Close"><i class="ph ph-x"></i></button>
    <h2 id="cell-title">—</h2>
    <div class="meta" id="cell-meta">—</div>
    <div class="clist" id="cell-list" style="max-height:46vh"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const fmt = n => n>=1e6 ? (n/1e6).toFixed(2)+'M' : n>=1e3 ? (n/1e3).toFixed(0)+'K' : ''+n;
  const esc = s => String(s).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  let CFG = null, CUSTOMERS = [], current = null;

  async function api(path, opts){
    const r = await fetch(path, opts);
    if(!r.ok){ throw new Error((await r.text()).slice(0,300) || ('HTTP '+r.status)); }
    return r.json();
  }

  async function boot(){
    try {
      CFG = await api('/api/config');
      CUSTOMERS = (await api('/api/customers')).customers || [];
    } catch(e){
      console.info('Customers backend not reachable — panel hidden (static mode).');
      return;                                  // stay invisible; dashboard unaffected
    }
    if(!CUSTOMERS.length) return;
    // Customers panel removed — customer data stays loaded for the
    // click-a-building popup and the email modal.
  }


  function openCustomer(id){
    const c = CUSTOMERS.find(x => x.id === id);
    if(!c) return;
    current = c;
    $('cm-company').textContent = c.company;
    $('cm-meta').textContent = `${c.contact} · ${c.industry} · ${c.email}`;
    const movable = c.avoidable_spend > 0;
    $('cm-stats').innerHTML = `
      <div class="stat"><div class="k">Resources</div><div class="v">${c.resource_count}</div></div>
      ${movable
        ? `<div class="stat"><div class="k">Migration</div>
             <div class="v move">${esc(c.current_cloud_label)} <b>→ ${esc(c.target_cloud_label)}</b></div></div>`
        : `<div class="stat"><div class="k">Status</div>
             <div class="v ok">Already on cheapest cloud</div></div>`}
      <div class="stat"><div class="k">Discount offer</div>
        <div class="v disc">${movable ? c.discount_pct + '%' : '—'}</div></div>
      <div class="stat"><div class="k">Monthly spend</div><div class="v">${fmt(c.monthly_spend)} u</div></div>
      <div class="stat"><div class="k">Avoidable</div><div class="v">${fmt(c.avoidable_spend)} u</div></div>
      <div class="stat"><div class="k">Destination</div>
        <div class="v">${movable ? esc(c.target_cloud_label) : 'No migration needed'}</div></div>`;
    const rows = c.resources.slice().sort((a,b)=>b.monthly_spend-a.monthly_spend);
    $('cm-res').innerHTML =
      `<div class="reshead"><span>Service</span><span>Region</span><span class="rsp">Spend</span><span class="rsv">Save</span></div>` +
      rows.map(r => `<div class="resrow">
        <span>${r.units}× ${esc(r.service_label)}</span>
        <span>${esc(r.geo_label)}</span>
        <span class="rsp">${fmt(r.monthly_spend)}</span>
        <span class="rsv">${Math.round(r.savings_ratio*100)}%</span></div>`).join('');
    // reset email area
    $('cm-email').classList.remove('show');
    $('cm-subject').value = ''; $('cm-body').value = '';
    $('cm-model').textContent = ''; $('cm-status').textContent = ''; $('cm-status').className='status';
    $('cm-draft').disabled = !movable;      // nothing to pitch if already on cheapest
    $('cm-draft').innerHTML = movable ? '<i class="ph ph-sparkle"></i> Draft email with AI'
                                      : 'No migration to pitch';
    $('cust-modal').classList.add('open');
  }

  function closeModal(){ $('cust-modal').classList.remove('open'); }
  $('cust-close').onclick = closeModal;
  $('cust-modal').onclick = e => { if(e.target.id==='cust-modal') closeModal(); };
  document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

  $('cm-draft').onclick = async () => {
    if(!current) return;
    const btn = $('cm-draft');
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Drafting…';
    try {
      const d = await api('/api/draft', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({customer_id: current.id})
      });
      $('cm-subject').value = d.subject || '';
      $('cm-body').value = d.body || '';
      $('cm-model').textContent = 'Drafted by ' + (d.model || 'template') + ' · edit before sending';
      $('cm-email').classList.add('show');
      btn.innerHTML = '<i class="ph ph-sparkle"></i> Re-draft';
    } catch(e){
      $('cm-status').className = 'status err';
      $('cm-status').textContent = 'Draft failed: ' + e.message;
    } finally { btn.disabled = false; }
  };

  $('cm-send').onclick = async () => {
    if(!current) return;
    const btn = $('cm-send'), st = $('cm-status');
    btn.disabled = true; st.className='status'; st.innerHTML = '<span class="spin"></span>Sending…';
    try {
      const r = await api('/api/send', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({customer_id: current.id,
          subject: $('cm-subject').value, body: $('cm-body').value})
      });
      if(r.status === 'sent'){
        st.className='status ok'; st.innerHTML = `<i class="ph ph-check"></i> Sent to ${esc(r.to)}` + (r.id ? ` (id ${esc(r.id)})` : '');
      } else {
        st.className='status warn';
        st.textContent = `Dry-run — would send to ${r.to}. ${r.detail||''}`;
      }
    } catch(e){
      st.className='status err'; st.textContent = 'Send failed: ' + e.message;
    } finally { btn.disabled = false; }
  };

  // ---- Click a building -> show the customers running there ----
  // Tiered match so a click always lands on something: same cloud+region+service
  // first, then same cloud+service, then anyone on that cloud.
  function lbl(kind, code){
    for(const c of CUSTOMERS) for(const r of c.resources){
      if(kind==='cloud'   && r.cloud===code)   return r.cloud_label;
      if(kind==='service' && r.service===code) return r.service_label;
      if(kind==='geo'     && r.geo===code)     return r.geo_label;
    }
    return code;
  }
  function closeCell(){ $('cell-modal').classList.remove('open'); }

  // Compact customer list for the hover tooltip. Same tiered match as openCell,
  // returns an HTML string (or '' in static mode / no match). Read-only.
  window.__costcityCellCustomers = function(d){
    if(!CUSTOMERS.length) return '';
    const pred = {
      here:  r => r.cloud===d.cloud && r.geo===d.geo && r.service===d.service,
      cloud: r => r.cloud===d.cloud && r.service===d.service,
      any:   r => r.cloud===d.cloud,
    };
    let tier='here', list = CUSTOMERS.filter(c => c.resources.some(pred.here));
    if(!list.length){ tier='cloud'; list = CUSTOMERS.filter(c => c.resources.some(pred.cloud)); }
    if(!list.length){ tier='any';   list = CUSTOMERS.filter(c => c.resources.some(pred.any)); }
    if(!list.length) return '';
    const p = pred[tier];
    const svc = lbl('service', d.service), cl = lbl('cloud', d.cloud), geo = lbl('geo', d.geo);
    const n = list.length;
    const head = tier==='here'  ? `${n} customer${n>1?'s':''} running ${esc(svc)} in ${esc(geo)}`
               : tier==='cloud' ? `${n} customer${n>1?'s':''} on ${esc(cl)} · other regions`
               :                  `${n} customer${n>1?'s':''} on ${esc(cl)}`;
    const rows = list
      .map(c => ({c, spend: c.resources.filter(p).reduce((s,r)=>s+r.monthly_spend,0)}))
      .sort((a,b)=>b.spend-a.spend);
    const MAX = 5;
    let html = `<div class="t-cust"><div class="t-cust-h"><i class="ph ph-buildings"></i> ${head}</div>`;
    for(const {c, spend} of rows.slice(0, MAX)){
      const move = c.avoidable_spend > 0;
      html += `<div class="t-cust-row"><span class="cc">${esc(c.company)}</span>`
            + `<span class="cm">${fmt(spend)}u${move ? ` · −${c.discount_pct}%` : ''}</span></div>`;
    }
    if(rows.length > MAX) html += `<div class="t-cust-more">+${rows.length - MAX} more</div>`;
    return html + `</div>`;
  };

  function openCell(d){
    if(!CUSTOMERS.length) return;                    // static mode: nothing to show
    const pred = {
      here:  r => r.cloud===d.cloud && r.geo===d.geo && r.service===d.service,
      cloud: r => r.cloud===d.cloud && r.service===d.service,
      any:   r => r.cloud===d.cloud,
    };
    let tier='here', list = CUSTOMERS.filter(c => c.resources.some(pred.here));
    if(!list.length){ tier='cloud'; list = CUSTOMERS.filter(c => c.resources.some(pred.cloud)); }
    if(!list.length){ tier='any';   list = CUSTOMERS.filter(c => c.resources.some(pred.any)); }
    const p = pred[tier];

    const svc = lbl('service', d.service), cl = lbl('cloud', d.cloud), geo = lbl('geo', d.geo);
    $('cell-title').innerHTML =
      `<i class="ph ph-buildings"></i> ${esc(svc)} <span style="color:var(--dim);font-weight:400">on</span> ${esc(cl)}`;
    const n = list.length;
    $('cell-meta').textContent =
      !n ? `No customers running on ${cl} yet — try another building.`
      : tier==='here'  ? `${n} customer${n>1?'s':''} running ${svc} in ${geo} on ${cl}`
      : tier==='cloud' ? `${n} customer${n>1?'s':''} running ${svc} on ${cl} (other regions)`
      :                  `${n} customer${n>1?'s':''} on ${cl}`;

    const rows = list
      .map(c => ({c, spend: c.resources.filter(p).reduce((s,r)=>s+r.monthly_spend,0)}))
      .sort((a,b)=>b.spend-a.spend);
    $('cell-list').innerHTML = rows.map(({c,spend}) => `
      <div class="crow" data-id="${c.id}">
        <div>
          <div class="cname">${esc(c.company)}</div>
          <div class="croute">${esc(c.current_cloud_label)} <b>→ ${esc(c.target_cloud_label)}</b>
            · ${fmt(spend)} u here</div>
        </div>
        <div class="cbadge">−${c.discount_pct}%</div>
      </div>`).join('') || '<div class="csub" style="padding:10px 4px">No matching customers.</div>';
    $('cell-list').querySelectorAll('.crow').forEach(el =>
      el.onclick = () => { closeCell(); openCustomer(el.dataset.id); });
    $('cell-modal').classList.add('open');
  }

  $('cell-close').onclick = closeCell;
  $('cell-modal').onclick = e => { if(e.target.id==='cell-modal') closeCell(); };
  document.addEventListener('keydown', e => { if(e.key==='Escape') closeCell(); });
  // Customers now surface in the hover tooltip (see __costcityCellCustomers),
  // so a building click no longer opens the cell modal.

  boot();
})();
</script>
</body>
</html>
