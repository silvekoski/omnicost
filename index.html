<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Omnicost</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" /><style>
  :root{ --bg:#17181c; --nav:#1f2127; --line:#2e3138;
         --txt:#f4f3f0; --muted:#8c8a84; --teal:#7ba78f; --accent:#5e8d77; --pink:#c87f59; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);overflow:hidden;
    font-family:Helvetica,"Helvetica Neue",Arial,sans-serif}

  #nav{position:absolute;top:0;left:0;right:0;height:104px;z-index:10;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:0 22px;
    background:var(--nav);
    border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
  .brand{justify-self:start;display:flex;align-items:center}
  .brand .logo{height:80px;width:auto;display:block;
    filter:drop-shadow(0 0 18px rgba(94,141,119,.55))}

  .tabs{display:flex;gap:6px;justify-self:center;background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:11px;padding:4px}
  .tab{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
    color:var(--muted);padding:7px 15px;border-radius:8px;cursor:pointer;
    border:none;background:none;transition:all .15s;white-space:nowrap}
  .tab:hover{color:var(--txt)}
  .tab.active{background:var(--accent);color:#f4f3f0}
  .tab .ic{font-size:14px;line-height:1}

  #views{position:absolute;top:104px;left:0;right:0;bottom:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  iframe.hidden{display:none}

  .spinner{position:absolute;inset:104px 0 0 0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;gap:10px;z-index:1}
  .spinner.gone{display:none}
  .spinner i{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

  </div>

<script>
  const SOURCES = { grid: "cost_city.html", map: "geo_distribution.html", customers: "customers.html" };
  const TITLES = { grid: "Cost City — grid view", map: "Geographic distribution — map view",
                   customers: "Customers — roster & AI outreach" };
  const views = document.getElementById("views");
  const spinner = document.getElementById("spinner");
  const frames = {};   // view -> iframe (lazy-created on first activation)
  let current = null;

  function show(view){
    if(view === current) return;
    // lazy-create the iframe the first time a view is opened (so each app
    // initialises at full size — MapLibre/Three.js misbehave when hidden)
    if(!frames[view]){
      spinner.classList.remove("gone");
      const f = document.createElement("iframe");
      f.title = TITLES[view] || view;
      f.addEventListener("load", ()=> spinner.classList.add("gone"));
      f.src = SOURCES[view];
      views.appendChild(f);
      frames[view] = f;
    } else {
      spinner.classList.add("gone");
      // nudge the already-loaded app to re-fit to the viewport
      try{ frames[view].contentWindow.dispatchEvent(new Event("resize")); }catch(e){}
    }
    for(const v in frames) frames[v].classList.toggle("hidden", v !== view);
    document.querySelectorAll(".tab").forEach(t =>
      t.classList.toggle("active", t.dataset.view === view));
    current = view;
  }

  document.querySelectorAll(".tab").forEach(t =>
    t.addEventListener("click", ()=> show(t.dataset.view)));

  // default landing view
  show("grid");
</script>
